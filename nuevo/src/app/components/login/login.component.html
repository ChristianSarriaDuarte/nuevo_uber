<form (ngSubmit)="login()">

  <ion-item>
    <ion-label position="floating">Email</ion-label>
    <ion-input type="email" name="email" placeholder="email" [(ngModel)]="email"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating"></ion-label>
    <ion-input name="password" placeholder="password" [(ngModel)]="password"></ion-input>
  </ion-item>

  <br>

  <ion-button type="submit" expand="full" color="sucess">Loguear</ion-button>
</form>
<br><br>

<ion-button (click)="register()" expand="full" color="danger">registrar</ion-button>
